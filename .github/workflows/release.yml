# Builds the zip (one E7Bot folder for both clients) when a version tag such as v1.0.0 is pushed,
# and publishes it as the release "E7Bot 1.0.0".
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # package.py names the zip after the tag, so the tags must be there.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # The zip ships its own Tesseract, copied from this install.
      - name: Install Tesseract
        run: choco install tesseract --no-progress -y

      - name: Build the zip
        run: python tools/package.py

      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --title "E7Bot ${GITHUB_REF_NAME#v}" \
            --notes-file tools/release_notes.md
